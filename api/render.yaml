services:
  - type: web
    name: bite-lab-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bitelab-db
          property: connectionString
      - key: PORT
        value: 3000
      - key: INTASEND_PUBLIC_KEY
        sync: false
      - key: INTASEND_SECRET_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://kirst3nn.github.io/Bitalabtesting
      - key: WEBHOOK_SECRET
        sync: false

databases:
  - name: bitelab-db
    databaseName: bitelab
    user: bitelab_user
    region: oregon
